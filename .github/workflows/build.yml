name: build
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
    inputs: { ref: { description: "ref to build", required: false } }
permissions: { contents: read }
jobs:
  build:
    uses: hollis-labs/tools/.github/workflows/go-app-build.yml@145fb50d827a1af7e38236eda5751cee22970ba5   # tools main (extra_files, pre_test_cmd)
    with:
      app: basalisk
      main_pkg: ./cmd/basalisk
      node_version: "22"
      ui_cmd: "cd frontend && npm ci && npm run build"          # == make ui-build; writes internal/webui/dist (embedded)
      test_cmd: "go vet ./cmd/... ./internal/... && go test -race -count=1 ./cmd/... ./internal/..."
      extra_files: deploy.yaml
      ldflags_var: ""       # no main.version var found; set to the real one if added
