name: build
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
    inputs: { ref: { description: "ref to build", required: false } }
permissions: { contents: read }
jobs:
  build:
    uses: hollis-labs/tools/.github/workflows/go-app-build.yml@27c5d904a7dfafbb71dca884b0d31fc0849d39fb   # tools#9 merge commit
    with:
      app: basalisk
      main_pkg: ./cmd/basalisk
      node_version: "22"
      ui_cmd: "cd frontend && npm ci && npm run build"          # == make ui-build; writes internal/webui/dist (embedded)
      test_cmd: "go vet ./cmd/... ./internal/... && go test -race -count=1 ./cmd/... ./internal/..."
      ldflags_var: ""       # no main.version var found; set to the real one if added
