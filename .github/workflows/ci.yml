name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the hygiene scan reads history
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The dashboard is built first: internal/webui embeds frontend/ output, and the Go
      # tests need those assets.
      - name: Build and lint the dashboard (including design tokens)
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - run: go vet ./...
      - name: pins match the Substrate BOM
        run: go run github.com/hollis-labs/substrate/cmd/substrate pins check --app .
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
      - name: hygiene (secrets, hosts, private paths; tree and history)
        run: python3 scripts/scan-public --ref HEAD
