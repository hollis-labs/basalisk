name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and lint the dashboard (including design tokens)
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - run: go mod tidy
      - run: go vet ./cmd/... ./internal/...
      - run: go build ./cmd/... ./internal/...
      - run: go test -race ./cmd/... ./internal/...
